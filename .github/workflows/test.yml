# sara 9/10/26: runs the julia suite, then generates both examples and
# simulates them, which otherwise only ever happens on my laptop.
name: tests

on:
  push:
  pull_request:

jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: unit tests
        run: julia --project=. test/runtests.jl

      - name: install icarus verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # the LED example: generate, then check the whole project elaborates
      - name: generate and elaborate controller_with_shift
        run: |
          julia --project=. scripts/isabella.jl examples/controller_with_shift.yaml \
                -o build/led -f -q
          cd build/led
          iverilog -I. -o elab.vvp src/timer.sv src/led_controller_with_shift.sv
          iverilog -I. -o top.vvp top/led_controller_with_shift_top.sv \
                   src/timer.sv src/led_controller_with_shift.sv

      # 9/22/26 sara: his second example, four routines in one ROM
      - name: generate and elaborate controller_with_multiple_programs
        run: |
          julia --project=. scripts/isabella.jl examples/controller_with_multiple_programs.yaml \
                -o build/multi -f -q
          cd build/multi
          iverilog -I. -o elab.vvp src/timer.sv src/led_controller_with_multiple_programs.sv
          iverilog -I. -o top.vvp top/led_controller_with_multiple_programs_top.sv \
                   src/timer.sv src/led_controller_with_multiple_programs.sv

      # 9/25/26 sara: his led_controller_bigger, 21 routines and a full 256
      # byte rom. the only example that uses JZ and the _B register.
      - name: generate and elaborate led_controller_bigger
        run: |
          julia --project=. scripts/isabella.jl examples/led_controller_bigger.yaml \
                -o build/bigger -f -q
          cd build/bigger
          iverilog -I. -o elab.vvp src/timer.sv src/led_controller_bigger.sv
          iverilog -I. -o top.vvp top/led_controller_bigger_top.sv \
                   src/timer.sv src/led_controller_bigger.sv

      # the seven segment example: generate, elaborate, and actually run it
      - name: generate and simulate seven_segment
        run: |
          julia --project=. scripts/isabella.jl examples/seven_segment.yaml \
                -o build/seg -f -q
          cd build/seg
          iverilog -I. -o tb.vvp sim/tb_seven_segment.sv \
                   src/timer.sv src/seven_segment.sv
          vvp tb.vvp

      # the timer, at both clock rates, and the controller testbenches
      - name: simulate the timer and the FSM
        run: |
          julia --project=. scripts/isabella.jl test/ctrl_test.yaml -o build/t -f -q
          cd build/t
          iverilog -o timer.vvp ../../test/tb_timer.sv src/timer.sv
          vvp timer.vvp
          iverilog -I. -o fsm.vvp ../../test/tb_controller.sv \
                   src/timer.sv src/ctrl_test.sv
          vvp fsm.vvp

      # sara 9/15/26: the instruction overhead numbers in docs/instruction_set.md
      - name: measure instruction overhead
        run: |
          julia --project=. scripts/isabella.jl test/ctrl_overhead.yaml -o build/ovh -f -q
          cd build/ovh
          iverilog -I. -o ovh.vvp ../../test/tb_overhead.sv                    src/timer.sv src/ctrl_overhead.sv
          vvp ovh.vvp | tee ovh.txt
          grep -q "ALL OVERHEAD CHECKS PASSED" ovh.txt

      # sara 09/22: the register commands, including the not taken branches
      - name: simulate the register commands
        run: |
          julia --project=. scripts/isabella.jl test/ctrl_register.yaml -o build/reg -f -q
          cd build/reg
          iverilog -I. -o reg.vvp ../../test/tb_register.sv \
                   src/timer.sv src/ctrl_register.sv
          vvp reg.vvp | tee reg.txt
          grep -q "ALL REGISTER CHECKS PASSED" reg.txt

      - name: simulate the T6 edge cases
        run: |
          julia --project=. scripts/isabella.jl test/ctrl_t6.yaml -o build/t6 -f -q
          cd build/t6
          iverilog -I. -o t6.vvp ../../test/tb_controller_t6.sv \
                   src/timer.sv src/ctrl_t6.sv
          vvp t6.vvp | tee out.txt
          grep -q "ALL T6 CHECKS PASSED" out.txt

      # sara 10/14/26: T9, the bash path. that is the student side of the
      # server plan, and nothing ran it before. julia writes the bundle the
      # way the README shows, controller_project unpacks it, and the tree
      # has to match isabella.jl. the script's echo ends every file with a
      # newline and isabella.jl does not always, so ref gets one first.
      # the runner's own yq is the Go one, the script wants kislyuk's.
      - name: bash path, controller_project on all four examples
        run: |
          python3 -m venv "$RUNNER_TEMP/yq"
          "$RUNNER_TEMP/yq/bin/pip" install -q yq==3.4.3
          export PATH="$RUNNER_TEMP/yq/bin:$PATH"
          yq --version
          mkdir -p build/bash && cd build/bash
          for ex in controller_with_shift controller_with_multiple_programs \
                    seven_segment led_controller_bigger; do
            julia --project=../.. -e 'using Isabella, YAML; YAML.write_file(ARGS[2], generate_controller_project(YAML.load_file(ARGS[1])))' \
                  ../../examples/$ex.yaml $ex.yaml
            ../../scripts/controller_project $ex.yaml
            julia --project=../.. ../../scripts/isabella.jl ../../examples/$ex.yaml -o ref_$ex -f -q
            find ref_$ex -type f -exec sed -i -e '$a\' {} +
            diff -r ref_$ex $ex
          done
